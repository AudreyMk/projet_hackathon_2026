<div class="hero-wrap">
  <p class="hero-title">Climat <span>France</span><br>1900 → 2100</p>
  <p class="hero-sub">Analyse · Prédiction · Sensibilisation citoyenne — Hackathon #26 · Sup²Vinci</p>

  <div class="hero-stats">
    <div class="hero-stat">
      <span class="hero-stat-icon">🌡️</span>
      <div class="hero-stat-body">
        <div class="hero-stat-val">+{{delta_temp}}°C</div>
        <div class="hero-stat-label">Hausse depuis 1900</div>
      </div>
    </div>
    <div class="hero-stat">
      <span class="hero-stat-icon">🏭</span>
      <div class="hero-stat-body">
        <div class="hero-stat-val">{{co2}} ppm</div>
        <div class="hero-stat-label">CO₂ atmosphérique</div>
      </div>
    </div>
    <div class="hero-stat">
      <span class="hero-stat-icon">⚠️</span>
      <div class="hero-stat-body">
        <div class="hero-stat-val">{{risk}}/100</div>
        <div class="hero-stat-label">Score de risque</div>
      </div>
    </div>
  </div>

  <div class="hero-badge">
    <span class="hero-badge-dot"></span>
    Alerte climatique active — données temps réel
  </div>
</div>
