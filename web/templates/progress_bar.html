<div style='background:var(--cd-bg-card);border:1px solid var(--cd-border);border-radius:10px;padding:16px 20px;margin-top:8px'>
  <div style='font-size:0.78rem;color:var(--cd-text-muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px'>
    Progression vers la neutralité carbone 2050
  </div>
  <div style='background:var(--cd-border);border-radius:6px;height:10px;overflow:hidden'>
    <div style='width:{{progress_pct}}%;height:10px;background:linear-gradient(90deg,{{green}},{{accent}});border-radius:6px'></div>
  </div>
  <div style='display:flex;justify-content:space-between;margin-top:6px;font-size:0.78rem;color:var(--cd-text-muted)'>
    <span>Actuel : {{current}} tCO₂eq/hab</span>
    <span>{{progress_pct}}% du chemin</span>
    <span>Cible : {{target}} tCO₂eq/hab</span>
  </div>
</div>
